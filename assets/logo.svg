<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#071324" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E396" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA771C" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F5E396" />
    </linearGradient>

    <!-- Royal Blue Accent Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)" />

  <!-- Subtle Outer Border with Gold -->
  <rect x="15" y="15" width="470" height="470" rx="30" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Central Shield / Umbrella Crest -->
  <g transform="translate(250, 230)">
    <!-- Heraldic Shield Base -->
    <path d="M 0 -140 C 70 -140 120 -110 120 -40 C 120 70 50 130 0 160 C -50 130 -120 70 -120 -40 C -120 -110 -70 -140 0 -140 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="5" filter="url(#goldGlow)" />
    
    <path d="M 0 -130 C 62 -130 106 -103 106 -40 C 106 60 44 115 0 142 C -44 115 -106 60 -106 -40 C -106 -103 -62 -130 0 -130 Z" 
          fill="#0c1e38" fill-opacity="0.85" stroke="url(#blueGrad)" stroke-width="2" />

    <!-- Protective Umbrella Silhouette (Under One Roof) -->
    <path d="M 0 -85 C 45 -85 75 -50 78 -20 C 50 -25 25 -25 0 -20 C -25 -25 -50 -25 -78 -20 C -75 -50 -45 -85 0 -85 Z" 
          fill="url(#goldGrad)" />
    <!-- Umbrella Ferrule -->
    <line x1="0" y1="-95" x2="0" y2="-85" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Umbrella Shaft & Handle J-Hook -->
    <path d="M 0 -20 L 0 50 C 0 65 -15 65 -18 55" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Twin Stars of Excellence -->
    <polygon points="0,-48 3,-38 13,-38 5,-32 8,-22 0,-28 -8,-22 -5,-32 -13,-38 -3,-38" fill="#ffffff" />
    <polygon points="-45,-42 -43,-34 -35,-34 -41,-29 -39,-21 -45,-26 -51,-21 -49,-29 -55,-34 -47,-34" fill="url(#goldGrad)" />
    <polygon points="45,-42 47,-34 55,-34 49,-29 51,-21 45,-26 39,-21 41,-29 35,-34 43,-34" fill="url(#goldGrad)" />

    <!-- Laurel Wreath Around Shield -->
    <g fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <!-- Left Laurel -->
      <path d="M -135 -30 C -150 40 -100 120 -30 170" />
      <ellipse cx="-138" cy="-10" rx="7" ry="3" transform="rotate(-30, -138, -10)" fill="url(#goldGrad)" />
      <ellipse cx="-145" cy="20" rx="7" ry="3" transform="rotate(-15, -145, 20)" fill="url(#goldGrad)" />
      <ellipse cx="-135" cy="55" rx="7" ry="3" transform="rotate(10, -135, 55)" fill="url(#goldGrad)" />
      <ellipse cx="-110" cy="95" rx="7" ry="3" transform="rotate(35, -110, 95)" fill="url(#goldGrad)" />
      <ellipse cx="-75" cy="130" rx="7" ry="3" transform="rotate(55, -75, 130)" fill="url(#goldGrad)" />
      <ellipse cx="-35" cy="160" rx="7" ry="3" transform="rotate(70, -35, 160)" fill="url(#goldGrad)" />

      <!-- Right Laurel -->
      <path d="M 135 -30 C 150 40 100 120 30 170" />
      <ellipse cx="138" cy="-10" rx="7" ry="3" transform="rotate(30, 138, -10)" fill="url(#goldGrad)" />
      <ellipse cx="145" cy="20" rx="7" ry="3" transform="rotate(15, 145, 20)" fill="url(#goldGrad)" />
      <ellipse cx="135" cy="55" rx="7" ry="3" transform="rotate(-10, 135, 55)" fill="url(#goldGrad)" />
      <ellipse cx="110" cy="95" rx="7" ry="3" transform="rotate(-35, 110, 95)" fill="url(#goldGrad)" />
      <ellipse cx="75" cy="130" rx="7" ry="3" transform="rotate(-55, 75, 130)" fill="url(#goldGrad)" />
      <ellipse cx="35" cy="160" rx="7" ry="3" transform="rotate(-70, 35, 160)" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- Typography at Bottom -->
  <text x="250" y="420" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="21" font-weight="700" letter-spacing="3" fill="url(#goldGrad)">
    INSURANCE UNDER ONE ROOF
  </text>
  <text x="250" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="500" letter-spacing="4" fill="#94a3b8">
    KIRAN HIRALAL POPAT • 19 YEARS OF TRUST
  </text>
</svg>

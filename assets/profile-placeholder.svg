<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="avatarBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a63" />
      <stop offset="50%" stop-color="#0f2440" />
      <stop offset="100%" stop-color="#081424" />
    </radialGradient>

    <!-- Metallic Gold Ring Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#996515" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Suit & Tie Gradients -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBg)" stroke="url(#goldBorder)" stroke-width="6" filter="url(#shadowFilter)" />
  <circle cx="200" cy="200" r="182" fill="none" stroke="#2563eb" stroke-width="2" stroke-opacity="0.4" />

  <!-- Executive Silhouette Graphic -->
  <g id="executiveSilhouette">
    <!-- Suit Shoulders & Lapels -->
    <path d="M 60 380 C 65 310 115 270 160 260 L 200 300 L 240 260 C 285 270 335 310 340 380 Z" fill="url(#suitGrad)" />
    
    <!-- White Collared Shirt -->
    <polygon points="160,260 200,305 240,260 215,225 185,225" fill="#ffffff" />
    
    <!-- Royal Blue Tie -->
    <polygon points="194,260 206,260 209,330 200,345 191,330" fill="url(#tieGrad)" />
    <!-- Tie Knot -->
    <polygon points="193,250 207,250 204,262 196,262" fill="#1e40af" />

    <!-- Neck -->
    <rect x="184" y="200" width="32" height="35" rx="5" fill="url(#faceGrad)" />

    <!-- Head / Face -->
    <ellipse cx="200" cy="155" rx="46" ry="58" fill="url(#faceGrad)" />
    
    <!-- Executive Hairline Styling -->
    <path d="M 152 145 C 152 95 180 80 200 80 C 220 80 248 95 248 145 C 238 120 220 100 200 100 C 180 100 162 120 152 145 Z" fill="#334155" />
  </g>

  <!-- Gold Lapel Pin Badge -->
  <circle cx="140" cy="310" r="8" fill="url(#goldBorder)" />
  <path d="M 137 310 L 139 313 L 144 307" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Label Ribbon Overlay -->
  <g transform="translate(200, 355)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#071324" stroke="url(#goldBorder)" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#f8fafc">
      KIRAN POPAT
    </text>
  </g>
</svg>
